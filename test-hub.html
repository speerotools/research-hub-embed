<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speero Research Hub — local test</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,900;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dist/embed.css">

<!--
  Serve it, do not open from the filesystem, or the fetch is blocked by CORS:
      python3 -m http.server 8000
  Query params: ?data=<url>  &route=problems|recipes|methods  &links=cms
-->

<div id="speero-research-hub"></div>

<script>
  const params = new URLSearchParams(location.search);
  window.RESEARCH_HUB_CONFIG = {
    dataUrl: params.get("data") ||
      "https://cdn.jsdelivr.net/gh/speerotools/research-hub-data@main/research-hub.json",
    // null keeps detail views inside the embed, which is how the wireframe behaves
    recipeBase: params.get("links") === "cms" ? "/research-recipes/" : null,
    methodBase: params.get("links") === "cms" ? "/research-methods/" : null,
    defaultRoute: params.get("route") || ""
  };
</script>
<script src="dist/embed.js"></script>
